# pose_estimator_params.yaml
# Parameters for pose_estimator.py — 2D bbox → 3D grasp pose conversion.
#
# Scene geometry (must match pick_and_place_env.sdf):
#   left stereo camera:     position (-0.20, 0, 2.20), looking straight down
#   right stereo camera:    position ( 0.20, 0, 2.20), looking straight down
#   Using LEFT camera for detection (topic /camera_left/image_raw).
#   table surface:          z = 0.780 m
#
# Box heights (from SDF models/):
#   small  0.06 × 0.04 × 0.04 m  → h = 0.04 m
#   medium 0.10 × 0.07 × 0.06 m  → h = 0.06 m
#   large  0.16 × 0.12 × 0.10 m  → h = 0.10 m
#
# Sign parameters (calibration):
#   x_sign  / y_sign  control how pixel axes map to world XY.
#   yaw_sign controls the sign of the box angle relative to world yaw.
#   Default values assume Gazebo Harmonic overhead camera convention:
#     +u (pixel right) → +X_world   → x_sign  = +1.0
#     +v (pixel down)  → −Y_world   → y_sign  = −1.0
#     image OBB angle  = world yaw  → yaw_sign = +1.0
#   If objects appear mirrored along one axis, negate that sign here.

pose_estimator:
  ros__parameters:
    # LEFT stereo camera position in world frame (metres) — for XY back-projection
    camera_x: -0.40
    camera_y:  0.0
    camera_z:  2.50

    # Stereo baseline (m): distance between left and right camera X positions.
    # SDF has L at x=-0.40, R at x=+0.20 → baseline = 0.60 m.
    stereo_baseline_m: 0.60

    # Min detection confidence to accept (below this = ignored, mostly false positives)
    min_confidence: 0.70

    # Table surface height in world frame (metres)
    table_z: 0.780

    # Gripper approach height above box top (metres).
    # Set to reach the top face of the box with the gripper fully open.
    gripper_standoff: 0.05

    # TF frame used for published grasp poses
    grasp_frame: "world"

    # Table bounds (world frame) — для отсева ложных детекций на полу/стенах
    table_x_min: -0.95
    table_x_max:  0.95
    table_y_min: -0.20
    table_y_max:  0.25

    # Pixel-to-world sign parameters
    # Gazebo Harmonic overhead camera (pitch=π/2, yaw=π/2): u→X, v→-Y
    x_sign:    1.0
    y_sign:   -1.0
    yaw_sign:  1.0
